<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - SAPA Kabupaten Pandeglang</title>

    <link rel="icon" href="assets/logo.png" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================
NAVBAR
=========================== -->

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="assets/logo.png" alt="Logo Kemenag" class="navbar-logo" decoding="async">
        <span class="navbar-brand-text">
            SAPA
            <small>Sentra Pelayanan Keagamaan</small>
        </span>
    </a>
    <div class="navbar-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link active">Login</a>
        <a href="chat.html" class="nav-link nav-link-ai">🤖 AI Assistant KUA</a>
    </div>
</nav>

    <!-- ==========================
         LOGIN FORM
    =========================== -->

    <main class="login-main">

        <div class="login-card">

            <div class="login-card-header">
                <h2>Portal Login</h2>
                <p>Khusus petugas KUA dan admin SAPA</p>
            </div>

            <form class="login-form">

                <div class="form-group">
                    <label for="username">Username / Email</label>
                    <input type="text" id="username" placeholder="Masukkan username atau email" required>
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" placeholder="Masukkan kata sandi" required>
                </div>

                <button type="submit" class="login-btn">Masuk</button>

            </form>

            <a href="index.html" class="back-link">← Kembali ke Beranda</a>

        </div>

    </main>

<!-- ==========================
     FOOTER
=========================== -->

<footer class="site-footer">

    <div class="footer-bottom">
        <p>&copy; 2026 SAPA — Kementerian Agama Kabupaten Pandeglang</p>
    </div>

</footer>

</body>

</html>
