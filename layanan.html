<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Layanan KUA - SAPA Kabupaten Pandeglang</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

</head>

<body>

<!-- ==========================
NAVBAR
=========================== -->

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="assets/logo.png" alt="Logo Kemenag" class="navbar-logo" decoding="async">
        <span class="navbar-brand-text">
            SAPA
            <small>Sentra Pelayanan Keagamaan</small>
        </span>
    </a>
    <div class="navbar-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link">Login</a>
        <a href="chat.html" class="nav-link nav-link-ai">🤖 AI Assistant KUA</a>
    </div>
</nav>

    <!-- ==========================
         KONTEN
    =========================== -->

    <main class="container">

        <a href="index.html" class="back-link-page">← Kembali ke Beranda</a>

        <div id="kuaInfo" class="kua-header">
            <p class="loading-text">Memuat data KUA...</p>
        </div>

        <h2 class="layanan-title">Layanan yang Tersedia</h2>

        <div id="layananGrid" class="layanan-grid">
            <p class="loading-text">Memuat layanan...</p>
        </div>

    </main>

<!-- ==========================
     FOOTER
=========================== -->

<footer class="site-footer">

    <div class="footer-bottom">
        <p>&copy; 2026 SAPA — Kementerian Agama Kabupaten Pandeglang</p>
    </div>

</footer>

    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script>

        const SUPABASE_URL = "https://bwmnuzgxnhlhpawrzwmp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_92nPJq33RxieAG6T-mj99A_vPUik0D4";
        const TABLE_NAME = "Data_KUA";

        const params = new URLSearchParams(window.location.search);
        const kuaId = params.get("id");

        if (!kuaId){

            document.getElementById("kuaInfo").innerHTML =
                "<p class='no-result'>KUA tidak ditemukan.</p>";

        } else {

            fetch(`${SUPABASE_URL}/rest/v1/${TABLE_NAME}?id=eq.${kuaId}&select=*`, {
                headers: {
                    apikey: SUPABASE_KEY,
                    Authorization: `Bearer ${SUPABASE_KEY}`
                }
            })
            .then(response => response.json())
            .then(data => {

                if (!data || data.length === 0){
                    document.getElementById("kuaInfo").innerHTML =
                        "<p class='no-result'>KUA tidak ditemukan.</p>";
                    return;
                }

                const kua = data[0];

                document.title = `${kua.nama} - SAPA Kabupaten Pandeglang`;

                document.getElementById("kuaInfo").innerHTML = `

                    <h1>Selamat Datang di ${kua.nama}</h1>

                    <span class="status ${kua.status === "AKTIF" ? "aktif" : "nonaktif"}">
                        ${kua.status}
                    </span>

                `;

                renderLayanan(kua);

            })
            .catch(error => {

                console.error(error);

                document.getElementById("kuaInfo").innerHTML =
                    "<p class='no-result'>Data gagal dimuat.</p>";

            });

        }

        function renderLayanan(kua){

            const namaKua = kua.nama;

            const layanan = [
                {
                    warna: "teal",
                    judul: "Pusat Pengaduan",
                    isi: `Saluran pengaduan masyarakat terhadap pelayanan ${namaKua}.`,
                    link: `pengaduan.html?id=${kua.id}`
                },

                {
                    warna: "purple",
                    judul: "Layanan Digital Resmi",
                    isi: `Berisi layanan publik yang ada di ${namaKua} seperti SIMKAH, dll.`,
                    link: `inovasi.html?id=${kua.id}`
                },
                {
                    warna: "green",
                    judul: "Dokumentasi Digital KUA",
                    isi: `Berisi data-data digital yang ada di dalam ${namaKua}.`
                },
                {
                    warna: "blue-gray",
                    judul: "Pelayanan KUA",
                    isi: `Pelayanan yang ada di ${namaKua}:`,
                    daftar: [
                        "Pendaftaran/Pelaporan Kehendak Nikah/Rujuk",
                        "Bimbingan Perkawinan",
                        "Pengukuran Arah Kiblat",
                        "Penerbitan Akte Ikrar Wakaf",
                        "Konsultasi Hukum Islam",
                        "Konsultasi Keluarga"
                    ]
                },
              
              
              
                {
                    warna: "orange",
                    judul: "Moderasi Beragama",
                    isi: `Gerakan moderasi lintas agama di wilayah kerja ${namaKua}.`
                },
                
                
                {
                    warna: "blue",
                    judul: "DATAKU (Data Keagamaan Terpadu)",
                    isi: `Data-data yang dimiliki ${namaKua}:`,
                    daftar: [
                        "Rumah Ibadah",
                        "Lembaga Pendidikan",
                        "Data Penduduk Berdasarkan Agama",
                        "Penyuluh Agama",
                        "Aset Umat",
                        "Ormas Keagamaan",
                        "Lembaga Bimbingan Rohani",
                        "Tokoh Agama"
                    ]
                }
            ];

            let html = "";

            // Kotak Media Sosial dibangun terpisah (isinya beda tiap KUA:
            // Instagram, Facebook, atau kosong kalau belum diisi)
            let medsosLinks = "";

            if (kua.instagram){
                medsosLinks += `<a href="${kua.instagram}" target="_blank">📷 Instagram</a>`;
            }

            if (kua.facebook){
                medsosLinks += `<a href="${kua.facebook}" target="_blank">📘 Facebook</a>`;
            }

            if (!medsosLinks){
                medsosLinks = "<p>Belum ada media sosial terdaftar.</p>";
            }

            const medsosHtml = `

            <div class="layanan-tile layanan-indigo">
                <h3>Media Sosial</h3>
                <p>Beberapa platform media sosial yang dimiliki ${namaKua}.</p>
                <div class="medsos-links">${medsosLinks}</div>
            </div>

            `;

            // Kotak lain dibangun lewat perulangan, dan kotak Media Sosial
            // disisipkan tepat setelah "Inovasi Layanan Publik" (posisi ke-3)
            layanan.forEach((item, index) => {

                const isLink = Boolean(item.link);
                const isExternal = isLink && item.link.startsWith("http");

                html += `

                <a href="${item.link || '#'}"
                   ${isExternal ? 'target="_blank"' : (isLink ? '' : 'onclick="return false;"')}
                   class="layanan-tile layanan-${item.warna} ${isLink ? '' : 'layanan-tile-static'}">
                    <h3>${item.judul}</h3>
                    <p>${item.isi}</p>
                    ${item.daftar ? "<ul>" + item.daftar.map(d => `<li>${d}</li>`).join("") + "</ul>" : ""}
                </a>

                `;

                if (item.judul === "Inovasi Layanan Publik"){
                    html += medsosHtml;
                }

            });

            document.getElementById("layananGrid").innerHTML = html;

        }

    </script>

</body>

</html>
