<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inovasi Layanan Publik - SAPA Kabupaten Pandeglang</title>

    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="responsive.css">

    <style>

        /* ==========================
           KARTU INOVASI
           (khusus halaman ini, tidak mengubah style.css)
        ========================== */

        .inovasi-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:18px;
            margin-bottom:40px;
        }

        .inovasi-card{
            position:relative;
            display:flex;
            flex-direction:column;
            background:#2d333b;
            border:1px solid rgba(255,255,255,.10);
            border-left:4px solid #2ecc8f;
            border-radius:14px;
            padding:22px 20px;
            text-decoration:none;
            color:inherit;
            box-shadow:0 6px 14px rgba(0,0,0,.3);
            transition:transform .2s ease, border-color .2s ease;
        }

        .inovasi-card:hover{
            transform:translateY(-4px);
            border-color:#2ecc8f;
        }

        .inovasi-head{
            display:flex;
            align-items:center;
            gap:12px;
            margin-bottom:12px;
            padding-right:26px;
        }

        .inovasi-ikon{
            flex-shrink:0;
            width:42px;
            height:42px;
            border-radius:12px;
            background:rgba(46,204,143,.12);
            border:1px solid rgba(46,204,143,.25);
            display:flex;
            align-items:center;
            justify-content:center;
            line-height:1;
            transition:background .2s ease, transform .2s ease;
        }

        .inovasi-ikon i{
            font-size:22px;
            color:#2ecc8f;
            line-height:1;
        }

        .inovasi-card:hover .inovasi-ikon{
            background:rgba(46,204,143,.22);
            transform:scale(1.06);
        }

        .inovasi-card h3{
            font-size:17px;
            color:#2ecc8f;
            margin:0;
            line-height:1.3;
        }

        .inovasi-card p{
            font-size:13.5px;
            line-height:1.6;
            color:#8b949e;
            flex:1;
        }

        .inovasi-tag{
            display:inline-block;
            align-self:flex-start;
            margin-top:14px;
            padding:5px 12px;
            border-radius:20px;
            background:rgba(46,204,143,.12);
            color:#2ecc8f;
            font-size:11.5px;
            font-weight:600;
            letter-spacing:.3px;
        }

        .inovasi-panah{
            position:absolute;
            top:20px;
            right:18px;
            font-size:16px;
            color:#8b949e;
            transition:color .2s ease, transform .2s ease;
        }

        .inovasi-card:hover .inovasi-panah{
            color:#2ecc8f;
            transform:translate(3px,-3px);
        }

        @media (max-width:950px){
            .inovasi-grid{ grid-template-columns:repeat(2,1fr); }
        }

        @media (max-width:600px){
            .inovasi-grid{ grid-template-columns:1fr; gap:16px; }
            .inovasi-ikon{ width:38px; height:38px; }
            .inovasi-ikon i{ font-size:20px; }
        }

    </style>

</head>

<body>

<!-- ==========================
NAVBAR
=========================== -->

<nav class="navbar">
    <a href="index.html" class="navbar-brand">
        <img src="assets/logo.png" alt="Logo Kemenag" class="navbar-logo" decoding="async">
        <span class="navbar-brand-text">
            SAPA
            <small>Sentra Pelayanan Keagamaan</small>
        </span>
    </a>
    <div class="navbar-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="login.html" class="nav-link">Login</a>
        <a href="chat.html" class="nav-link nav-link-ai">🤖 AI Assistant KUA</a>
    </div>
</nav>

    <!-- ==========================
         KONTEN
    =========================== -->

    <main class="container">

        <a href="#" id="backLink" class="back-link-page">← Kembali ke Layanan</a>

        <div id="kuaInfo" class="kua-header">
            <h1>Inovasi Layanan Publik</h1>
        </div>

        <p style="color:#8b949e; font-size:15px; line-height:1.6; margin-bottom:26px; max-width:660px;">
            Layanan digital resmi Kementerian Agama yang bisa diakses masyarakat
            secara mandiri, kapan saja, tanpa perlu datang ke kantor.
        </p>

        <div id="inovasiGrid" class="inovasi-grid"></div>

    </main>

<!-- ==========================
     FOOTER
=========================== -->

<footer class="site-footer">

    <div class="footer-bottom">
        <p>&copy; 2026 SAPA — Kementerian Agama Kabupaten Pandeglang</p>
    </div>

</footer>

    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script>

        // ==========================================================
        // DAFTAR LAYANAN
        // Sumber alamat: halaman resmi kemenag.go.id/layanan
        //
        // Untuk menambah layanan baru, salin satu blok { ... }
        // lalu ubah isinya. Tidak perlu menyentuh bagian lain.

        // ==========================================================

        const daftarInovasi = [

            {
                ikon: "ti-heart",
                judul: "SIMKAH",
                tag: "Layanan Nikah",
                isi: "Daftar nikah secara online dan mandiri. Setelah mendaftar, calon pengantin tinggal datang ke KUA untuk pemeriksaan berkas.",
                link: "https://simkah4.kemenag.go.id/"
            },

            {
                ikon: "ti-apps",
                judul: "PUSAKA Super Apps",
                tag: "Aplikasi Terpadu",
                isi: "Aplikasi resmi Kemenag yang menaungi banyak layanan sekaligus: daftar haji, nikah, sertifikasi halal, sampai konten keagamaan enam agama.",
                link: "https://pusaka.kemenag.go.id/"
            },

            {
                ikon: "ti-building-mosque",
                judul: "SIMAS",
                tag: "Info Masjid",
                isi: "Sistem Informasi Masjid. Cek apakah masjid atau musala sudah terdaftar dan punya ID Nasional Masjid, lengkap dengan pemetaan lokasinya.",
                link: "https://simas.kemenag.go.id/"
            },

            {
                ikon: "ti-speakerphone",
                judul: "SIMDUMAS",
                tag: "Pengaduan",
                isi: "Saluran pengaduan masyarakat resmi Kementerian Agama, untuk melaporkan keluhan atau dugaan pelanggaran layanan.",
                link: "https://simdumas.kemenag.go.id"
            },

            {
                ikon: "ti-file-text",
                judul: "PPID Kemenag",
                tag: "Informasi Publik",
                isi: "Pejabat Pengelola Informasi dan Dokumentasi. Ajukan permohonan informasi publik dan lihat dokumen yang wajib dibuka ke masyarakat.",
                link: "https://ppid.kemenag.go.id/v5/"
            },

            {
                ikon: "ti-scale",
                judul: "JDIH Kemenag",
                tag: "Regulasi",
                isi: "Jaringan Dokumentasi dan Informasi Hukum. Cari peraturan, PMA, dan regulasi resmi Kementerian Agama.",
                link: "https://jdih.kemenag.go.id/"
            },

            {
                ikon: "ti-book",
                judul: "Qur'an Digital",
                tag: "Al-Qur'an",
                isi: "Al-Qur'an digital resmi terbitan Kementerian Agama, lengkap dengan terjemah dan tafsir yang sudah ditashih.",
                link: "https://quran.kemenag.go.id"
            },

            {
                ikon: "ti-books",
                judul: "ELIPSKI",
                tag: "Perpustakaan Digital",
                isi: "Perpustakaan digital Kemenag. Baca koleksi literatur keagamaan secara gratis, tanpa perlu meminjam fisik.",
                link: "https://simbi.kemenag.go.id/eliterasi/"
            },

            {
                ikon: "ti-users",
                judul: "Si-Rukun",
                tag: "Layanan Sosial",
                isi: "Layanan Pusat Kerukunan Umat Beragama. Informasi dan layanan seputar kerukunan antarumat beragama.",
                link: "https://pkubpusat.kemenag.go.id/pwa/"
            },

            {
                ikon: "ti-moon-stars",
                judul: "Bimas Islam",
                tag: "Portal Layanan",
                isi: "Portal resmi Ditjen Bimbingan Masyarakat Islam. Berisi regulasi, pengumuman, dan informasi layanan keagamaan Islam.",
                link: "https://bimasislam.kemenag.go.id/"
            }

        ];


        // ==========================================================
        // TAMPILKAN KARTU
        // ==========================================================

        const params = new URLSearchParams(window.location.search);
        const kuaId = params.get("id");

        const backLink = document.getElementById("backLink");

        if (kuaId){
            backLink.href = `layanan.html?id=${kuaId}`;
        } else {
            backLink.href = "index.html";
            backLink.textContent = "← Kembali ke Beranda";
        }

        let html = "";

        daftarInovasi.forEach(item => {

            html += `

            <a href="${item.link}" target="_blank" rel="noopener" class="inovasi-card">

                <span class="inovasi-panah">↗</span>

                <div class="inovasi-head">
                    <span class="inovasi-ikon"><i class="ti ${item.ikon}" aria-hidden="true"></i></span>
                    <h3>${item.judul}</h3>
                </div>

                <p>${item.isi}</p>

                <span class="inovasi-tag">${item.tag}</span>

            </a>

            `;

        });

        document.getElementById("inovasiGrid").innerHTML = html;

    </script>

</body>

</html>
