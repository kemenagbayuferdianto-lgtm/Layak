<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B6E4F"/>
      <stop offset="100%" stop-color="#0A5940"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Elemen dekoratif: lingkaran transparan -->
  <circle cx="1050" cy="80" r="180" fill="#ffffff" opacity="0.06"/>
  <circle cx="100" cy="560" r="140" fill="#ffffff" opacity="0.06"/>
  <circle cx="1100" cy="550" r="90" fill="#ffffff" opacity="0.08"/>

  <!-- Ikon masjid sederhana (kubah + menara) -->
  <g transform="translate(560, 130)" opacity="0.9">
    <rect x="-70" y="60" width="140" height="70" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="30" r="45" fill="#ffffff" opacity="0.15"/>
    <rect x="-6" y="-15" width="12" height="30" fill="#ffffff" opacity="0.15"/>
    <circle cx="0" cy="-20" r="7" fill="#ffffff" opacity="0.15"/>
    <rect x="-95" y="90" width="16" height="40" fill="#ffffff" opacity="0.15"/>
    <rect x="79" y="90" width="16" height="40" fill="#ffffff" opacity="0.15"/>
  </g>

  <!-- Judul utama -->
  <text x="600" y="380" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    SAPA
  </text>

  <!-- Subjudul -->
  <text x="600" y="430" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.95">
    Sentra Pelayanan Agama
  </text>

  <!-- Garis pemisah -->
  <rect x="530" y="500" width="140" height="3" fill="#ffffff" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="540" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#e6f4ee" text-anchor="middle">
    Informasi &amp; Layanan KUA Kabupaten Pandeglang
  </text>

</svg>