<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SAPA Kabupaten Pandeglang</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ==========================
HEADER
=========================== -->

<header class="site-header">
    <h1>SAPA</h1>
    <p>Sentra Pelayanan Agama — Kabupaten Pandeglang</p>
</header>

    <!-- ==========================
         SEARCH
    =========================== -->

    <section class="search-box">

        <p class="search-label">Cari KUA di sini 👇</p>

        <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input
                type="text"
                id="search"
                placeholder="Cari Kecamatan, Kepala KUA, atau Nama KUA..."
                autofocus>
        </div>

    </section>


    <!-- ==========================
         TOMBOL KE CHATBOT
    =========================== -->

    <div class="ai-button-wrapper">
        <a href="chat.html" class="ai-button">
            🤖 Tanya AI Assistant KUA
        </a>
    </div>


    <!-- ==========================
         CARD
    =========================== -->

    <main class="container">

        <div id="cards" class="cards-container">

            <!-- Card akan dibuat otomatis oleh script.js -->

        </div>

    </main>
    
<!-- ==========================
     FOOTER
=========================== -->

<footer class="site-footer">

    <div class="footer-bottom">
        <p>&copy; 2026 SAPA — Kementerian Agama Kabupaten Pandeglang</p>
    </div>

</footer>

    <!-- ==========================
         JAVASCRIPT
    =========================== -->

    <script src="script.js"></script>

</body>

</html>
