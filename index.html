    <style>
        /* ---------- pita sambutan + pencarian ---------- */
        .pita{
            margin:0 -16px 18px;
            padding:26px 20px 24px;
            background:linear-gradient(180deg,#20443a 0%,#22272e 100%);
        }
        .pita-isi{max-width:760px;margin:0 auto}
        .pita .daerah{
            font-size:12.5px;
            letter-spacing:.6px;
            color:#2ecc8f;
            font-weight:600;
            margin-bottom:6px;
        }
        .pita h1{
            font-size:23px;
            line-height:1.35;
            color:#cdd9e5;
            font-weight:700;
            margin-bottom:18px;
        }

        /* ---------- ajakan utama ---------- */
        .aksi-cepat{
            max-width:760px;
            margin:0 auto 20px;
        }
        .aksi-cepat a{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:9px;
            width:100%;
            min-height:50px;
            padding:12px 18px;
            border-radius:12px;
            border:2px solid #0B6E4F;
            background:#0B6E4F;
            color:#fff;
            font-size:15px;
            font-weight:600;
            text-decoration:none;
            text-align:center;
            line-height:1.35;
            transition:background .2s ease,border-color .2s ease;
        }
        .aksi-cepat a:hover{
            background:#17a874;
            border-color:#17a874;
        }
        .aksi-cepat svg{flex:none;width:19px;height:19px}

        .jumlah-hasil{
            font-size:13.5px;
            color:#8b949e;
            margin-bottom:12px;
        }
        .jumlah-hasil b{color:#cdd9e5;font-weight:600}

        /* ---------- daftar KUA ---------- */
        .cards-container{
            display:grid;
            grid-template-columns:1fr;
            gap:10px;
        }

        .kua-item{
            display:flex;
            align-items:center;
            gap:13px;
            padding:12px 14px;
            background:#2d333b;
            border:1px solid rgba(255,255,255,.10);
            border-radius:14px;
            cursor:pointer;
            text-decoration:none;
            color:inherit;
            transition:border-color .2s ease,background .2s ease;
        }
        .kua-item:hover{border-color:rgba(46,204,143,.5);background:#333a43}
        .kua-item:hover .kua-panah{transform:translateX(3px)}

        .kua-foto{
            width:60px;
            height:60px;
            flex:none;
            border-radius:11px;
            object-fit:cover;
            background:#22272e;
        }

        .kua-teks{flex:1;min-width:0}
        .kua-nama{
            display:block;
            font-size:15.5px;
            font-weight:600;
            color:#cdd9e5;
            line-height:1.3;
            margin-bottom:2px;
        }
        .kua-alamat{
            display:block;
            font-size:12.5px;
            color:#8b949e;
            line-height:1.45;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }
        .kua-kepala{
            display:flex;
            align-items:center;
            gap:5px;
            font-size:12px;
            color:#2ecc8f;
            margin-top:4px;
        }
        .kua-kepala.tutup{color:#8b949e}
        .kua-kepala svg{flex:none;width:13px;height:13px}

        .kua-panah{
            flex:none;
            color:#2ecc8f;
            transition:transform .2s ease;
        }
        .kua-panah svg{width:20px;height:20px;display:block}

        @media(min-width:820px){
            .pita h1{font-size:29px}
            .cards-container{grid-template-columns:1fr 1fr}
        }
    </style>

</head>

                    id="search"

    </div>
</section>

<main class="container">

    <!-- ==========================

    =========================== -->

    <div class="aksi-cepat">
        <a href="nikah.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 6.6a5 5 0 0 0-7.1 0L12 8.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 22l8.8-8.3a5 5 0 0 0 0-7.1z"/></svg>

    <p class="jumlah-hasil" id="jumlahHasil"><b>-</b> KUA ditemukan</p>

    <!-- ==========================

    =========================== -->

    <div id="cards" class="cards-container">
        <p class="loading-text">Memuat data KUA...</p>
