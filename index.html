<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo-area">
            <img src="assets/logo.png" alt="Logo Kementerian Agama">

            <div>
                <h2>SAPA</h2>
                <p>Sentra Pelayanan Agama</p>
            </div>
        </div>

        <nav>
            <a href="#">Beranda</a>
            <a href="#">Login</a>
        </nav>

    </header>

    <!-- HERO -->
    <section class="hero">
        <input
            type="text"
            id="search"
            placeholder="Cari Kecamatan...">
    </section>

    <!-- DAFTAR KUA -->
    <section class="container">

        <div id="cards" class="cards">
            <!-- Card akan ditampilkan oleh JavaScript -->
        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 SAPA | Sentra Pelayanan Agama Kabupaten Pandeglang</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
