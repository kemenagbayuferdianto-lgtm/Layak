<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>

        <nav>
            <a href="#">Beranda</a>
            <a href="#">Login</a>
        </nav>

    </header>

    <!-- BANNER -->
    <section class="hero">

        <div class="hero-logo">

            <img src="assets/logo.png" alt="Logo Kementerian Agama">

            <div>
                <h1>SAPA</h1>
                <p>Sentra Pelayanan Agama Kabupaten Pandeglang</p>
            </div>

        </div>

    </section>

    <!-- KOLOM PENCARIAN -->
    <section class="search-box">

        <input
            type="text"
            id="search"
            placeholder="Cari Kecamatan...">

    </section>

    <!-- DAFTAR KUA -->
    <section class="container">

        <div id="cards" class="cards">

            <!-- Card akan dibuat otomatis oleh script.js -->

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">

        <p>© 2026 SAPA | Sentra Pelayanan Agama Kabupaten Pandeglang</p>

    </footer>

    <script src="script.js"></script>

</body>

</html>
